[package]
name = "structured-zstd-wasm"
version = "0.0.30"
rust-version = "1.92"
authors = ["Structured World Foundation <foundation@sw.foundation>"]
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/structured-world/structured-zstd"
repository = "https://github.com/structured-world/structured-zstd"
description = "WebAssembly bindings for structured-zstd — pure-Rust zstd codec for browser, Node.js and Deno."
# npm-only distribution (the npm package is @structured-world/structured-zstd);
# this crate is never published to crates.io.
publish = false

[lib]
# `cdylib` is what wasm-pack consumes; `rlib` lets the workspace `cargo check`
# the crate on the host target (where the wasm-bindgen surface is cfg'd out).
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leaf binding crate: std + wasm-bindgen are fine here. The CORE crate stays
# no_std + bindgen-free; this wrapper is the only place wasm-bindgen appears.
wasm-bindgen = "0.2"
# Pull the core codec with no default features (no std) and the simd128 kernel
# tier. The actual SIMD selection is compile-time via `-C target-feature`:
# the +simd128 payload engages it, the scalar payload does not.
#
# Floating `version = "0"` (NOT an exact pin) so `cargo package`'s
# "all deps must have a version requirement" check passes without ANY
# per-release update: `^0` matches every `0.x.x` (0.0.31, 0.1.1, ...), so it
# survives the 0.0 -> 0.1 transition too; only the eventual 1.0.0 boundary
# would ever need a one-time bump. This crate is `release = false`, so
# release-plz never rewrites the requirement for us, and an exact pin would
# go stale on the next core bump and break packaging again. The requirement
# is purely ceremonial: `path` always wins for local/workspace builds and
# this crate is never published to crates.io.
# `hash` enables XXH64 content-checksum support (the `ContentChecksum` modes +
# encoder toggle exposed below). twox-hash is `no_std`, so this adds the
# checksum code without pulling `std`.
structured-zstd = { version = "0", path = "../zstd", default-features = false, features = ["kernel-simd128", "hash"] }

# Size-tuned wasm-pack release profile: optimise for size + a wasm-opt -Oz
# post-pass, since payload bytes are the budget for a published wasm module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz']
