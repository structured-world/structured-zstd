[workspace]
semver_check = false
# This fork releases through Git tags/GitHub releases instead of crates.io,
# so release-plz must derive the last released version from tags.
git_only = true
git_release_enable = true
changelog_update = true
# Fork release tags now own the `v*` namespace in this repo, so release-plz
# can follow the normal `v{{ version }}` pattern again.
git_tag_name = "v{{ version }}"
publish = false

[[package]]
name = "structured-zstd-cli"
release = false

# npm-only crate: published to npm (@structured-world/structured-zstd) by the
# release.yml `publish-npm` job, never to crates.io and with no git release of
# its own. release-plz may still bump its version on dependency updates; that
# version is non-authoritative — the npm publish stamps the package version
# from the release tag (Proposal A, single source of truth = Cargo.toml).
#
# Private tag namespace (`structured-zstd-wasm-v*`, never actually created
# because `release = false`). This crate was added after the workspace's last
# shared `v*` tag (v0.0.30), so resolving its "last release" against the shared
# `v{{ version }}` pattern pointed release-plz at the v0.0.30 worktree — where
# this package does not yet exist — and crashed `release-pr` with
# "Failed to find package". A namespace with no matching tag makes release-plz
# treat it as unreleased and skip that broken baseline diff. The main crate
# keeps the shared `v*` tag, so the npm version flow (tag → npm version) is
# unaffected.
[[package]]
name = "structured-zstd-wasm"
release = false
git_tag_name = "structured-zstd-wasm-v{{ version }}"

# C ABI cdylib (drop-in libzstd.so.1) — distributed as a system library, never
# from crates.io (`publish = false` in c-api/Cargo.toml), so it takes no git
# release of its own. Same baseline-diff trap as the wasm crate above: added
# after the last shared `v*` tag (v0.0.33), so resolving its "last release"
# against the shared `v{{ version }}` pattern checks out the v0.0.33 worktree
# where this package does not yet exist and crashes `release-pr` with "Failed
# to find package structured-zstd-c". A private tag namespace with no matching
# tag makes release-plz treat it as unreleased and skip the broken baseline diff.
[[package]]
name = "structured-zstd-c"
release = false
git_tag_name = "structured-zstd-c-v{{ version }}"

# Non-published bench/test crate: holds the libzstd-linking comparison benches,
# FFI parity tests, and diagnostic examples (`publish = false` in
# ffi-bench/Cargo.toml). It never releases anywhere. Same baseline-diff trap as
# the wasm and c-api crates above: added after the last shared `v*` tag, so
# resolving its "last release" against the shared `v{{ version }}` pattern
# checks out an old worktree where this package does not exist and crashes
# `release-pr` with "Failed to find package ffi-bench". A private tag namespace
# with no matching tag makes release-plz treat it as unreleased and skip the
# broken baseline diff.
[[package]]
name = "ffi-bench"
release = false
git_tag_name = "ffi-bench-v{{ version }}"

[changelog]
commit_parsers = [
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
    { message = "^build", skip = true },
    { message = "^docs\\(ci\\)", skip = true },
    { message = "^Merge", skip = true },
    { message = "^docs", group = "Documentation" },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactored" },
    { message = "^test", group = "Testing" },
]
