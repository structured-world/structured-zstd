[workspace]
resolver = "3"
members = ["zstd", "zstd-wasm", "c-api", "ffi-bench"]

# Fat LTO over one codegen unit, for the binaries this workspace ships and
# for everything that measures them.
#
# Cargo reads profiles from the workspace root only, so this does not reach a
# crate that depends on `structured-zstd`: that build uses its own profile.
# What it does reach is our `cli`, our examples and our benchmarks, and those
# should all be the same build. The optimiser's window is not a detail to
# leave differing between them: measured here, one edit reads -1.90%
# instructions over sixteen codegen units and +3.61% over one, and a chain of
# changes worth -6.5% under the first is +0.5% under the second. A benchmark
# that disagrees in SIGN with the shipped binary measures the wrong program.
#
# This is NOT claimed as a speed win, and it was measured rather than assumed:
# against cargo's release defaults, same source, prebuilt binaries interleaved
# three times, the decode loop reads 9.49-9.54 s without it and 9.38-9.46 s
# with it (about 1%, below the threshold this repository requires of a
# build-to-build claim), and the reused-compressor encode loop reads
# 1.34-1.38 s without it and 1.37-1.40 s with it, overlapping. The reason to
# set it is the paragraph above: the benchmark and the shipped binary must be
# one build.
#
# The cost is ours: release builds of this workspace take longer and peak
# higher. That is the right place for it to land.
[profile.release]
lto = "fat"
codegen-units = 1

# Benchmarks inherit the release profile above, with no debug info: a
# benchmark measures the shipped build and has no use for line tables.
[profile.bench]

# `cargo flamegraph` profile — like bench, but with FULL debug info
# so Rust symbol-mangling resolves in the .svg. The flamegraph tool
# reads DWARF inline info to demangle frames; `line-tables-only`
# strips the type info the demangler needs and leaves large `[unknown]`
# regions in the output. Kept separate from `bench` so timing runs
# stay fast (debug = "full" roughly doubles build time and bloats
# binaries ~5×). Use via
#   cargo flamegraph --profile flamegraph --bench compare_ffi -- ...
[profile.flamegraph]
inherits = "bench"
debug = "full"
strip = "none"

# Do NOT pin function alignment here, and do not add a workspace
# `.cargo/config.toml` that does it either.
#
# The encoder's hot functions are big enough that an edit anywhere moves the
# ones after it across cache lines, so a change to code one level never
# executes can still shift that level's timing by a few percent with the
# retired instruction count bit-identical. Forcing every function onto a
# 64-byte boundary (`-C llvm-args=-align-all-functions=6`) looks like the cure
# and is not: measured on the i9, the SAME commit built with and without the
# flag, three rounds each, per frame —
#
#   decodecorpus z000033, level 5      62.41 M -> 67.68 M cycles  (+8.4%)
#   8 MiB access log, level 9         679.19 M -> 710.21 M        (+4.6%)
#   8 MiB access log, level 1         131.85 M -> 134.53 M        (+2.0%)
#   z000033, levels 1 / 13 / 19                                   (+0.6..1.3%)
#   2 MiB incompressible, level 1                                 (-0.1%)
#
# It is slower on everything that moves. Two hand-picked cases said otherwise
# before the grid was run, which is the whole reason the grid gets run.
#
# The layout shift itself is also binary-dependent, so it is not a property of
# any change: the same pair of encoders that differ by up to 10% in the small
# `encode_loop_dict` example differ by 0.02-0.8% in the CLI. Read instruction
# counts for what a change did to the work, and treat a cycle delta with
# identical instruction counts as the binary it was measured in, not as a
# regression to chase.
