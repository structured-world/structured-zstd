[workspace]
resolver = "3"
members = ["zstd", "zstd-wasm", "c-api", "ffi-bench"]

# Bench profile inherits from release but overrides LTO/codegen-units so
# the perf measurement reflects full cross-crate inlining. We deliberately
# scope this to `[profile.bench]` instead of `[profile.release]`: the
# release profile is shared by the `cli` binary and every downstream
# consumer of this workspace, and fat LTO + codegen-units = 1 multiplies
# release build times ~5× and significantly increases peak compile RAM.
# Bench builds run on CI with the wall clock budget for it; everyday
# `cargo build --release` (and downstream consumers) should not pay that
# cost without explicitly opting in.
[profile.bench]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# `cargo flamegraph` profile — like bench, but with FULL debug info
# so Rust symbol-mangling resolves in the .svg. The flamegraph tool
# reads DWARF inline info to demangle frames; `line-tables-only`
# strips the type info the demangler needs and leaves large `[unknown]`
# regions in the output. Kept separate from `bench` so timing runs
# stay fast (debug = "full" roughly doubles build time and bloats
# binaries ~5×). Use via
#   cargo flamegraph --profile flamegraph --bench compare_ffi -- ...
[profile.flamegraph]
inherits = "bench"
debug = "full"
strip = "none"
