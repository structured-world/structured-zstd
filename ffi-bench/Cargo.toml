path = "../zstd/benches/dict_builder_fastcover.rs"
harness = false

[[bench]]
name = "decode_dict_handle"
path = "../zstd/benches/decode_dict_handle.rs"
harness = false

[[bench]]
name = "wildcopy_candidates"
path = "../zstd/benches/wildcopy_candidates.rs"
