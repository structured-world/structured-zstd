# Non-published crate holding every target that links the C `zstd` bindings:
# the rust-vs-C comparison benches, the cross-validation / parity integration
# tests, and the FFI diagnostic examples. It depends on `structured-zstd` (the
# pure-Rust library, which itself never imports the C bindings) plus `zstd`
# (zstd-sys). Targets reference the source files in `../zstd` directly via
# `path` so fixtures (`../zstd/decodecorpus_files`) and the shared
# `benches/support` module resolve unchanged.
[package]
name = "ffi-bench"
version = "0.0.0"
edition = "2024"
publish = false
autobenches = false
autotests = false
autoexamples = false

[lib]
path = "src/lib.rs"

[dependencies]
structured-zstd = { path = "../zstd", features = ["dict_builder", "bench_internals", "hash", "copy_shape_stats"] }
zstd = { version = "0.13.3", features = ["zdict_builder", "experimental"] }
criterion = "0.8"
rand = "0.10"
dhat = "0.3"

[features]
# Forward the structured-zstd features the bench/test/example sources gate on
# via `#[cfg(feature = ...)]`, so those cfg checks resolve in this crate too.
# Enabled by default to mirror the in-tree bench build.
default = ["hash", "dict_builder", "bench_internals", "copy_shape_stats"]
hash = ["structured-zstd/hash"]
dict_builder = ["structured-zstd/dict_builder"]
bench_internals = ["structured-zstd/bench_internals"]
copy_shape_stats = ["structured-zstd/copy_shape_stats"]
# The `dhat-heap` example swaps in the dhat global allocator; keep it opt-in so
# the timing benches do not pick up the profiling allocator.
dhat-heap = ["structured-zstd/dhat-heap"]

[[bench]]
name = "decode_all"
path = "../zstd/benches/decode_all.rs"
harness = false

