# Non-published crate holding every target that links the C `zstd` bindings:
# the rust-vs-C comparison benches, the cross-validation / parity integration
# tests, and the FFI diagnostic examples. It depends on `structured-zstd` (the
# pure-Rust library, which itself never imports the C bindings) plus `zstd`
# (zstd-sys). Targets reference the source files in `../zstd` directly via
# `path` so fixtures (`../zstd/decodecorpus_files`) and the shared
# `benches/support` module resolve unchanged.
[package]
name = "ffi-bench"
version = "0.0.0"
edition = "2024"
publish = false
autobenches = false
autotests = false
autoexamples = false

[lib]
path = "src/lib.rs"

[dependencies]
# Base features only — `dict_builder` is the one runtime feature the
# `compare_ffi` / `compare_ffi_memory` parity benches build against (matching
# what those benches measured when they lived in the library crate). The
# API-widening `bench_internals` and the instrumentation features
# (`hash`, `copy_shape_stats`) are NOT here: pulling them unconditionally
# would compile the Rust side differently than a real downstream consumer and
# bias every Rust-vs-libzstd comparison. Targets that genuinely need them opt
# in per-target via `required-features` below, so a bench built in isolation
# (`cargo bench --bench compare_ffi`) never links them.
structured-zstd = { version = "0.0", path = "../zstd", features = ["dict_builder"] }
zstd = { version = "0.13.3", features = ["zdict_builder", "experimental"] }
criterion = "0.8"
rand = "0.10"
dhat = "0.3"

[features]
# Forward the structured-zstd features the bench/test/example sources gate on
# via `#[cfg(feature = ...)]`. None are in `default`: each target that needs
# one lists it in `required-features`, which both activates the feature when
# that target is built and keeps it OFF the parity benches.
default = []
hash = ["structured-zstd/hash"]
dict_builder = ["structured-zstd/dict_builder"]
bench_internals = ["structured-zstd/bench_internals"]
copy_shape_stats = ["structured-zstd/copy_shape_stats"]
# The `dhat-heap` example swaps in the dhat global allocator; keep it opt-in so
# the timing benches do not pick up the profiling allocator.
dhat-heap = ["structured-zstd/dhat-heap"]

