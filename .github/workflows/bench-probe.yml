# Throwaway diagnostic. One question, four runs of one prebuilt binary.
#
# The `high-entropy-1m` decompress cell reads ~14 us however narrowly it is
# run, including with every fixture of a level and every group of that level in
# the same process, and ~28-39 us when the runner script drives the same binary
# over two levels. Two things change between those: the second level doubles
# the work done before the cell is reached, and the script sets
# STRUCTURED_ZSTD_EMIT_REPORT, which adds two full compressions of every
# fixture per level on top.
#
# Separate them: same binary, same two levels, reports off and then on, without
# the script. Then the script itself as the control. Each run also prints, at
# the moment the cell takes its buffers, where they landed plus the process's
# minor-fault count and resident size, which says whether any extra time is
# pages arriving during the loop or the placement of pages already there.
#
# Push-triggered on `probe/**` only. Delete the branch when the answer is in.
name: bench-probe

on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    name: matrix width versus report emission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Runner identity
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "nproc=$(nproc) loadavg=$(cat /proc/loadavg)"

      # Exactly the `bench-build` job's command and flags, so the binary under
      # test is the one the dashboard publishes from.
      - name: Build the bench binary as bench-build does
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cargo bench --bench compare_ffi -p ffi-bench \
            --target x86_64-unknown-linux-gnu --no-run \
            --message-format=json > build.log
          mkdir -p bench-binary
          bin_path=$(jq -r 'select(.executable != null and (.target.name == "compare_ffi")) | .executable' build.log | tail -1)
          test -x "$bin_path"
          cp "$bin_path" bench-binary/compare_ffi
          chmod +x bench-binary/compare_ffi
          # criterion writes its own state here and prints an error instead of a
          # timing when it cannot.
          mkdir -p target/criterion

      - name: One level, reports off
        run: |
          ./bench-binary/compare_ffi --bench --output-format bencher --noplot \
            --measurement-time 2 "/level_3_dfast/" 2>&1 \
            | grep -E '^test decompress|^PROBE_STATE ' || true

      - name: Two levels, reports off
        run: |
          ./bench-binary/compare_ffi --bench --output-format bencher --noplot \
            --measurement-time 2 "/level_(3_dfast|6_lazy)/" 2>&1 \
            | grep -E '^test decompress|^PROBE_STATE ' || true

      - name: Two levels, reports on
        env:
          STRUCTURED_ZSTD_EMIT_REPORT: '1'
        run: |
          ./bench-binary/compare_ffi --bench --output-format bencher --noplot \
            --measurement-time 2 "/level_(3_dfast|6_lazy)/" 2>&1 \
            | grep -E '^test decompress|^PROBE_STATE ' || true

      # The control: the command that produced 28-39 us.
      - name: The runner script, as the benchmark job invokes it
        env:
          STRUCTURED_ZSTD_BENCH_TARGET: x86_64-gnu
          STRUCTURED_ZSTD_BENCH_TRIPLE: x86_64-unknown-linux-gnu
          STRUCTURED_ZSTD_BENCH_GENERATED_AT: '2026-01-01T00:00:00+00:00'
          STRUCTURED_ZSTD_BENCH_LEVEL_FILTER: 'level_3_dfast,level_6_lazy'
          STRUCTURED_ZSTD_BENCH_BIN: ${{ github.workspace }}/bench-binary/compare_ffi
        run: ./.github/scripts/run-benchmarks.sh 2>&1 | grep -E '^test decompress|^PROBE_STATE ' || true
