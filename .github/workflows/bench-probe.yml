# Throwaway diagnostic. Does a small fixture's measured ratio depend on where
# its destination buffer sits?
#
# `small-10k-random` decompress is the one cell where the paired figure is
# noticeably less steady than the one it replaces, and its two SOURCES split by
# 20% in a run that read them 0.695 and 0.857 on work that should be identical:
# a 10 KiB random input compresses to raw blocks of the same length under both
# encoders. Source and destination are both L1-resident at that size, so the
# cache-set colouring between them can cost more than the decode, and the heap
# moves between runs.
#
# Sweep the destination's offset inside the arena and read the ratio at each.
# A flat sweep clears colouring and sends the search elsewhere; a swinging one
# names it, and the fix is then to place the source deliberately too rather
# than let a per-group allocation decide it.
#
# Push-triggered on `probe/**` only. Delete the branch when the answer is in.
name: bench-probe

on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    name: destination offset sweep on small-10k-random
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      STRUCTURED_ZSTD_EMIT_REPORT: '1'
      STRUCTURED_ZSTD_BENCH_LEVEL_FILTER: 'level_3_dfast'
      STRUCTURED_ZSTD_BENCH_LARGE_BYTES: '16777216'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Runner identity
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus=$(nproc)"; cat /proc/loadavg

      - name: Build the bench binary as bench-build does
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cargo bench --bench compare_ffi -p ffi-bench \
            --target x86_64-unknown-linux-gnu --no-run --message-format=json > build.log
          mkdir -p bench-binary target/criterion
          cp "$(jq -r 'select(.executable != null and (.target.name == "compare_ffi")) | .executable' build.log | tail -1)" \
            bench-binary/compare_ffi
          chmod +x bench-binary/compare_ffi

      # Offsets chosen to walk cache-line, page and multi-page distances, plus
      # two that are deliberately not powers of two.
      - name: Sweep the destination offset
        run: |
          for off in 0 64 320 4096 8192 12288 32768 65536 262144; do
            echo "--- offset $off"
            STRUCTURED_ZSTD_BENCH_PROBE_OFFSET=$off \
              ./bench-binary/compare_ffi --bench --output-format bencher --noplot \
              --measurement-time 1 "decompress/level_3_dfast/small-10k-random/" 2>&1 \
              | grep -E '^REPORT_PAIR|^PROBE_GEOM ' || true
          done

      # The same sweep on a fixture whose buffers are far too large to sit in
      # L1, as a control: if colouring is the mechanism, this one stays flat
      # while the small one swings.
      - name: The same sweep on a megabyte fixture
        run: |
          for off in 0 64 4096 65536; do
            echo "--- offset $off"
            STRUCTURED_ZSTD_BENCH_PROBE_OFFSET=$off \
              ./bench-binary/compare_ffi --bench --output-format bencher --noplot \
              --measurement-time 1 "decompress/level_3_dfast/high-entropy-1m/" 2>&1 \
              | grep -E '^REPORT_PAIR|^PROBE_GEOM ' || true
          done
