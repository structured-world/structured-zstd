# Throwaway diagnostic. Does spreading the paired batches over more, shorter
# visits make the published delta steadier at the same total cost?
#
# A disturbance long enough to cover a whole visit defeats any statistic inside
# it, and with three visits the median across them survives only one such
# visit. The bench now shares a fixed batch total over however many times the
# matrix runs, so nine rounds give nine visits of four batches where three
# rounds give three of twelve.
#
# Same binary, one machine, the real script: twice at three rounds, twice at
# nine, interleaved so a change in the machine lands on both settings. The
# number that matters is how far the paired delta moves between the two runs
# of each setting.
#
# Push-triggered on `probe/**` only. Delete the branch when the answer is in.
name: bench-probe

on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    name: three visits of twelve versus nine visits of four
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      STRUCTURED_ZSTD_BENCH_TARGET: x86_64-gnu
      STRUCTURED_ZSTD_BENCH_TRIPLE: x86_64-unknown-linux-gnu
      STRUCTURED_ZSTD_BENCH_GENERATED_AT: '2026-01-01T00:00:00+00:00'
      STRUCTURED_ZSTD_BENCH_LEVEL_FILTER: 'level_3_dfast'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Build the bench binary as bench-build does
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cargo bench --bench compare_ffi -p ffi-bench \
            --target x86_64-unknown-linux-gnu --no-run --message-format=json > build.log
          mkdir -p bench-binary
          cp "$(jq -r 'select(.executable != null and (.target.name == "compare_ffi")) | .executable' build.log | tail -1)" \
            bench-binary/compare_ffi
          chmod +x bench-binary/compare_ffi

      - name: Four runs, the two settings interleaved
        env:
          STRUCTURED_ZSTD_BENCH_BIN: ${{ github.workspace }}/bench-binary/compare_ffi
        run: |
          for pass in 1 2; do
            for rounds in 3 9; do
              echo "--- pass $pass, $rounds rounds"
              start=$(date +%s)
              STRUCTURED_ZSTD_BENCH_ROUNDS=$rounds ./.github/scripts/run-benchmarks.sh > /dev/null
              echo "took $(( $(date +%s) - start )) s"
              cp benchmark-relative.json "r${rounds}-p${pass}.json"
            done
          done

      - name: How far each setting's delta moved between its two runs
        run: |
          python3 - <<'PY'
          import json, statistics

          def rows(path):
              out = {}
              for record in json.load(open(path))["records"]:
                  if record.get("metric") != "throughput_bytes_per_sec":
                      continue
                  key = (record["stage"], record["scenario"], str(record.get("source")))
                  out[key] = record
              return out

          def moves(first, second, getter):
              result = {}
              for key in sorted(set(first) & set(second)):
                  a, b = getter(first[key]), getter(second[key])
                  if a and b and a > 0 and b > 0:
                      result[key] = abs(b / a - 1.0) * 100.0
              return result

          paired = lambda r: r["delta_ratio"] if r.get("delta_source") == "paired" else None
          arms = lambda r: r.get("delta_from_criterion_arms")

          table = {}
          for rounds in (3, 9):
              first, second = rows(f"r{rounds}-p1.json"), rows(f"r{rounds}-p2.json")
              for name, getter in (("paired", paired), ("arms", arms)):
                  table[(rounds, name)] = moves(first, second, getter)

          for (rounds, name), data in table.items():
              values = sorted(data.values())
              if not values:
                  continue
              print(f"rounds={rounds} {name:<7} n={len(values):<3} "
                    f"median={statistics.median(values):6.2f}%  "
                    f"p90={values[int(len(values) * 0.9)]:6.2f}%  max={max(values):6.2f}%")

          print()
          print(f"{'cell':<48}{'paired@3':>10}{'paired@9':>10}{'arms@3':>9}{'arms@9':>9}")
          keys = sorted(set(table[(3, 'paired')]) & set(table[(9, 'paired')]))
          for key in keys:
              label = "/".join(part for part in key if part != "None")
              print(f"{label:<48}{table[(3,'paired')][key]:9.1f}%{table[(9,'paired')][key]:9.1f}%"
                    f"{table[(3,'arms')].get(key, float('nan')):8.1f}%{table[(9,'arms')].get(key, float('nan')):8.1f}%")
          PY
