# Throwaway diagnostic. Does pinning the bench to one CPU make a cell read the
# same speed every time it runs?
#
# On the shared runners a cell has read two speeds ~1.4x apart inside one
# process, and the absolute level of the same binary and command has varied 4.5x
# between jobs. The first of those is what pinning could fix: a single-threaded
# bench that migrates between vCPUs loses the caches its samples were warming,
# and can land beside a busy sibling.
#
# Same binary throughout, run unpinned and pinned to one CPU, interleaved three
# times so a state belonging to the machine shows up in both. Each cell prints
# the CPU it is about to run on and the process's context-switch counts, so the
# mechanism is visible and not inferred from the timings.
#
# Push-triggered on `probe/**` only. Delete the branch when the answer is in.
name: bench-probe

on:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    name: pinned versus unpinned on one shared runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      STRUCTURED_ZSTD_BENCH_LEVEL_FILTER: 'level_3_dfast,level_6_lazy'
      # What the runner script sets on CI, so the fixture sizes match the ones
      # the dashboard measures rather than the much larger local defaults.
      STRUCTURED_ZSTD_BENCH_LARGE_BYTES: '16777216'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Runner identity
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus=$(nproc)"; cat /proc/loadavg; free -m | head -2
          taskset --version || echo "no taskset"

      - name: Build the bench binary as bench-build does
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=x86-64-v3"
        run: |
          cargo bench --bench compare_ffi -p ffi-bench \
            --target x86_64-unknown-linux-gnu --no-run --message-format=json > build.log
          mkdir -p bench-binary target/criterion
          cp "$(jq -r 'select(.executable != null and (.target.name == "compare_ffi")) | .executable' build.log | tail -1)" \
            bench-binary/compare_ffi
          chmod +x bench-binary/compare_ffi

      # The last CPU rather than the first: CPU 0 takes the interrupts.
      - name: Interleave unpinned and pinned
        run: |
          last_cpu=$(( $(nproc) - 1 ))
          echo "pinning to cpu $last_cpu"
          for pass in 1 2 3; do
            for mode in bare pinned; do
              echo "--- pass $pass, $mode"
              if [ "$mode" = pinned ]; then
                pin=(taskset -c "$last_cpu")
              else
                pin=()
              fi
              "${pin[@]}" ./bench-binary/compare_ffi --bench --output-format bencher \
                --noplot --measurement-time 2 \
                "decompress/.*/(high-entropy-1m|decodecorpus-synthetic-1m)/" 2>&1 \
                | grep -E '^test decompress|^PROBE_CPU ' || true
            done
          done
