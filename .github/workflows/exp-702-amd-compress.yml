name: exp 702 compression cells on hosted runners

# Experiment: the compression cells that lose to libzstd only on the hosted
# runners the dashboard runs on (AMD Zen 3 / Zen 4 and Intel, drawn per job),
# with the dashboard's build flags. Lives only on its experiment branch.
on:
  push:
    branches: ['exp/702-amd-*']

permissions:
  contents: read

jobs:
  shard:
    name: ${{ matrix.shard.id }} (${{ matrix.draw }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: fast-neg
            levels: level_-7_fast,level_-6_fast,level_-5_fast,level_-4_fast,level_-3_fast,level_-2_fast
          - id: fast-dfast
            levels: level_-1_fast,level_1_fast,level_2_fast,level_3_dfast,level_4_dfast,level_5_greedy
        draw: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
        run: cargo bench -q -p ffi-bench --bench compare_ffi --target x86_64-unknown-linux-gnu --no-run
      - name: Shard
        run: sh .github/exp-702/shard.sh ${{ matrix.shard.levels }}
